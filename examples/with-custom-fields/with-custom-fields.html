<html>
<head>
    <title>PayGov Classic POST Compatibility Example - Custom Fields</title>
</head>
<body onload="document.form1.submit();">
    <!-- Compatibility example only: this browser form exposes apipassword. Use PayGov Secure for new integrations. -->
    <form name="form1" method="post" action="https://qa-pay.paygov.us/API/PostAPI.aspx">
        <!-- Required Fields -->
        <input name="ttid" type="hidden" value="YOUR_TEST_TTID"> <!-- Required: Transaction Type ID -->
        <input name="apipassword" type="hidden" value="YOUR_TEST_API_PASSWORD"> <!-- Required: API Password -->
        <input name="paymentAmount" type="hidden" value="YOUR_TEST_AMOUNT"> <!-- Required: Payment Amount -->
        <input name="successURL" type="hidden" value="https://youragency.example.gov/success"> <!-- Required: Success URL -->
        <input name="orderToken" type="hidden" value="YOUR_ORDER_TOKEN"> <!-- Optional: Your tracking token -->
        
        <!-- Optional: Customer Information -->
        <input name="FirstName" type="hidden" value="John"> <!-- Optional: Customer first name -->
        <input name="LastName" type="hidden" value="Doe"> <!-- Optional: Customer last name -->
        <input name="Address1" type="hidden" value="123 Test Drive"> <!-- Optional: Street address -->
        <input name="City" type="hidden" value="Indianapolis"> <!-- Optional: City -->
        <input name="ZipCode" type="hidden" value="46062"> <!-- Optional: ZIP code -->
        <input name="Phone" type="hidden" value="9999999999"> <!-- Optional: Phone number -->
        
        <!-- Replace both placeholders with the exact field name and value supplied by PayGov for your test TID. -->
        <!-- Add one input per supplied field; these placeholders are not valid PayGov request names. -->
        <input name="YOUR_PAYGOV_SUPPLIED_FIELD_NAME" type="hidden" value="YOUR_FIELD_VALUE">
    </form>
</body>
</html>
